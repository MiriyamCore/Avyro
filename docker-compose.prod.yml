# Production stack for Avyro.
# Do not use docker-compose.yml for production — that file is local Postgres + Redis only.
#
# First-time:  ./infra/scripts/deploy.sh --seed
# Later:       ./infra/scripts/deploy.sh

name: avyro

x-app: &app
  build:
    context: .
    dockerfile: Dockerfile
    target: runner
  env_file:
    - .env
  environment:
    NODE_ENV: production
    API_INTERNAL_URL: http://api:3001
  restart: unless-stopped
  extra_hosts:
    - "host.docker.internal:host-gateway"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-accounting}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-avyro}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-accounting} -d ${POSTGRES_DB:-avyro}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432"

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  migrate:
    <<: *app
    depends_on:
      postgres:
        condition: service_healthy
    command: ["pnpm", "db:migrate:deploy"]
    restart: "no"

  seed:
    <<: *app
    profiles: ["seed"]
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    command: ["pnpm", "db:seed"]
    restart: "no"

  api:
    <<: *app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      API_INTERNAL_URL: http://api:3001
      STORAGE_ROOT: /data/storage
      BACKUP_ROOT: /data/backups
    volumes:
      - storage_data:/data/storage
      - backup_data:/data/backups
    command: ["node", "apps/api/dist/main.js"]
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001/api/v1/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  worker:
    <<: *app
    depends_on:
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      STORAGE_ROOT: /data/storage
      BACKUP_ROOT: /data/backups
    volumes:
      - storage_data:/data/storage
      - backup_data:/data/backups
    command: ["node", "apps/worker/dist/main.js"]

  web:
    <<: *app
    depends_on:
      api:
        condition: service_healthy
    environment:
      NODE_ENV: production
      API_INTERNAL_URL: http://api:3001
      HOSTNAME: 0.0.0.0
      PORT: "3000"
    command: ["pnpm", "--filter", "@avyro/web", "start"]
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      web:
        condition: service_healthy
    environment:
      NGINX_HOST: ${NGINX_HOST:-_}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/nginx/40-avyro.sh:/docker-entrypoint.d/40-avyro.sh:ro
      - certbot_www:/var/www/certbot
      - certbot_certs:/etc/letsencrypt
    healthcheck:
      test: ["CMD-SHELL", "wget -qO /dev/null http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  certbot:
    image: certbot/certbot
    volumes:
      - certbot_www:/var/www/certbot
      - certbot_certs:/etc/letsencrypt
    entrypoint:
      [
        "sh",
        "-c",
        "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet || true; sleep 12h; done",
      ]
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  storage_data:
  backup_data:
  certbot_www:
  certbot_certs:
